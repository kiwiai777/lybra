<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lybra Overview — Multi-Workspace Dashboard</title>
  <link rel="stylesheet" href="/overview.css">
  <link rel="stylesheet" href="/i18n.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <img src="/assets/lybra_logo_white.png" alt="Lybra" class="brand-logo">
      <div style="flex: 1;">
        <h1 class="brand-title" id="page-title">Lybra Overview</h1>
        <p class="brand-subtitle" id="page-subtitle">Multi-workspace command center</p>
      </div>
      <div id="lang-switcher-mount"></div>
      <div id="auth-chrome-mount"></div>
    </div>
  </header>

  <main>
    <div class="kicker">
      <div class="kicker-box"></div>
      <span class="kicker-text" id="kicker-text">Workspaces</span>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
      <h2 class="section-title" id="section-title" style="margin-bottom: 0;">All Projects</h2>
      <button id="add-project-btn" class="add-project-btn" title="Add new project" aria-label="Add new project">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span id="add-project-text"></span>
      </button>
    </div>
    
    <div id="workspace-grid" class="workspace-grid" data-owner-truth="overview">
      <div class="loading">Loading workspaces...</div>
    </div>

    <!-- AIPOS-277: New Project Panel (modal) -->
    <div id="add-project-modal" class="modal-mask" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h3 id="modal-title"></h3>
          <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p id="modal-intro"></p>
          
          <div class="input-group">
            <label for="project-name-input" id="project-name-label"></label>
            <input type="text" id="project-name-input" placeholder="my-project" />
            <div class="input-hint" id="project-name-hint"></div>
          </div>

          <!-- AIPOS-288 FIX-5: Optional English name -->
          <div class="input-group">
            <label for="project-name-en-input" id="project-name-en-label"></label>
            <input type="text" id="project-name-en-input" placeholder="My Project" />
            <div class="input-hint" id="project-name-en-hint"></div>
          </div>

          <div class="setup-options">
            <!-- Option A: Copy command -->
            <div class="setup-option">
              <div class="option-header">
                <span class="option-badge">A</span>
                <h4 id="option-a-title"></h4>
              </div>
              <p id="option-a-desc"></p>
              <div class="code-block">
                <code id="init-command">lybra init --project-id my-project</code>
                <button id="copy-init-btn" class="copy-btn" title="Copy command">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span id="copy-btn-text"></span>
                </button>
              </div>
            </div>

            <!-- Option B: Server-side init (if serve has file permissions) -->
            <div class="setup-option">
              <div class="option-header">
                <span class="option-badge">B</span>
                <h4 id="option-b-title"></h4>
              </div>
              <p id="option-b-desc"></p>
              <button id="server-init-btn" class="action-btn" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 5v14M5 12l7 7 7-7"></path>
                </svg>
                <span id="server-init-text"></span>
              </button>
              <div id="server-init-result" class="result-message" hidden></div>
            </div>

            <!-- AIPOS-293 S4 + FIX-1: Option C: Import existing project (dual mode) -->
            <div class="setup-option">
              <div class="option-header">
                <span class="option-badge">C</span>
                <h4 id="option-c-title"></h4>
              </div>
              <p id="option-c-desc"></p>

              <!-- Mode toggle: directory vs structure file -->
              <div class="import-mode-toggle" style="margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center;">
                <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer;">
                  <input type="radio" name="import-mode" value="directory" id="import-mode-directory" checked />
                  <span id="import-mode-directory-label"></span>
                </label>
                <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer;">
                  <input type="radio" name="import-mode" value="file" id="import-mode-file" />
                  <span id="import-mode-file-label"></span>
                </label>
              </div>

              <!-- Mode 1: Directory path input -->
              <div id="import-mode-directory-panel" class="input-group" style="margin-top: 0.5rem;">
                <label for="import-workspace-path" id="import-workspace-label"></label>
                <input type="text" id="import-workspace-path" placeholder="~/projects/my-existing-project" />
                <div class="input-hint" id="import-workspace-hint"></div>
                <!-- Smart hint: shown when .yaml detected in directory input -->
                <div id="import-yaml-hint" class="input-hint" style="color: #d97706; display: none; margin-top: 0.25rem;"></div>
              </div>

              <!-- Mode 2: Structure file input (hidden by default) -->
              <div id="import-mode-file-panel" class="input-group" style="margin-top: 0.5rem; display: none;">
                <label for="import-structure-file-path" id="import-structure-file-label"></label>
                <input type="text" id="import-structure-file-path" placeholder="/tmp/lybra-structure.yaml" />
                <div class="input-hint" id="import-structure-file-hint"></div>
                <div style="margin-top: 0.5rem;">
                  <label id="import-structure-file-upload-label" style="display: block; margin-bottom: 0.25rem;"></label>
                  <input type="file" id="import-structure-file-upload" accept=".yaml,.yml" style="font-size: 0.85rem;" />
                </div>
              </div>

              <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <button id="preview-import-btn" class="action-btn secondary">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <span id="preview-import-text"></span>
                </button>
                <button id="confirm-import-btn" class="action-btn" disabled>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12l7 7 7-7"></path>
                  </svg>
                  <span id="confirm-import-text"></span>
                </button>
              </div>
              <div id="import-preview-result" class="result-message" hidden></div>
              <div id="import-final-result" class="result-message" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script>
    // AIPOS-288 FIX-5: workspace label helper (EN prefers label_en, fallback to label)
    function workspaceLabel(workspace) {
      const lang = i18n.getCurrentLang();
      if (lang === 'en' && workspace.label_en) {
        return workspace.label_en;
      }
      return workspace.label || 'Unnamed Workspace';
    }

    // Render page with i18n
    function renderPage() {
      // Update static text
      document.getElementById('page-title').textContent = i18n.t('overview.title');
      document.getElementById('page-subtitle').textContent = i18n.t('overview.subtitle');
      document.getElementById('kicker-text').textContent = i18n.t('overview.workspaces');
      document.getElementById('section-title').textContent = i18n.t('overview.all_projects');
      document.getElementById('add-project-text').textContent = i18n.t('overview.add_project');
      
      // Modal i18n
      document.getElementById('modal-title').textContent = i18n.t('overview.new_project_modal.title');
      document.getElementById('modal-intro').textContent = i18n.t('overview.new_project_modal.intro');
      document.getElementById('project-name-label').textContent = i18n.t('overview.new_project_modal.project_name');
      document.getElementById('project-name-hint').textContent = i18n.t('overview.new_project_modal.project_name_hint');
      document.getElementById('project-name-en-label').textContent = i18n.t('overview.new_project_modal.project_name_en');
      document.getElementById('project-name-en-hint').textContent = i18n.t('overview.new_project_modal.project_name_en_hint');
      document.getElementById('option-a-title').textContent = i18n.t('overview.new_project_modal.option_a');
      document.getElementById('option-a-desc').textContent = i18n.t('overview.new_project_modal.option_a_desc');
      document.getElementById('option-b-title').textContent = i18n.t('overview.new_project_modal.option_b');
      document.getElementById('option-b-desc').textContent = i18n.t('overview.new_project_modal.option_b_desc');
      document.getElementById('copy-btn-text').textContent = i18n.t('overview.copy');
      document.getElementById('server-init-text').textContent = i18n.t('overview.init_now');
      // AIPOS-293 S4 + FIX-1: Option C i18n (dual mode)
      document.getElementById('option-c-title').textContent = i18n.t('overview.new_project_modal.option_c');
      document.getElementById('option-c-desc').textContent = i18n.t('overview.new_project_modal.option_c_desc');
      document.getElementById('import-workspace-label').textContent = i18n.t('overview.new_project_modal.import_workspace_path');
      document.getElementById('import-workspace-hint').textContent = i18n.t('overview.new_project_modal.import_workspace_hint');
      document.getElementById('import-mode-directory-label').textContent = i18n.t('overview.new_project_modal.import_mode_directory');
      document.getElementById('import-mode-file-label').textContent = i18n.t('overview.new_project_modal.import_mode_file');
      document.getElementById('import-structure-file-label').textContent = i18n.t('overview.new_project_modal.import_structure_file_path');
      document.getElementById('import-structure-file-hint').textContent = i18n.t('overview.new_project_modal.import_structure_file_hint');
      document.getElementById('import-structure-file-upload-label').textContent = i18n.t('overview.new_project_modal.import_structure_file_upload');
      document.getElementById('import-yaml-hint').textContent = i18n.t('overview.new_project_modal.import_yaml_hint');
      document.getElementById('preview-import-text').textContent = i18n.t('overview.new_project_modal.preview_import');
      document.getElementById('confirm-import-text').textContent = i18n.t('overview.new_project_modal.confirm_import');
      
      // Mount language switcher
      const switcherMount = document.getElementById('lang-switcher-mount');
      switcherMount.innerHTML = '';
      switcherMount.appendChild(i18n.createLanguageSwitcher());
      
      // Reload data
      loadOverview();
    }
    
    // Fetch and render workspace overview
    async function loadOverview() {
      const grid = document.getElementById('workspace-grid');
      
      try {
        const response = await fetch('/api/overview');
        const data = await response.json();
        
        if (!data.ok || !data.workspaces || data.workspaces.length === 0) {
          grid.innerHTML = `<div class="loading">${i18n.t('overview.no_workspaces')}</div>`;
          return;
        }
        
        grid.innerHTML = '';
        
        data.workspaces.forEach((ws, index) => {
          const card = createWorkspaceCard(ws, index);
          grid.appendChild(card);
        });
        
      } catch (error) {
        grid.innerHTML = `<div class="loading">${i18n.t('overview.error')}: ${error.message}</div>`;
      }
    }
    
    function createWorkspaceCard(workspace, index) {
      const card = document.createElement('a');
      card.className = 'workspace-card';
      card.href = `/workspace/${index}`; // Links to new project-detail page
      
      if (workspace.status === 'error') {
        card.className += ' error';
        card.onclick = (e) => {
          e.preventDefault();
          alert(`Workspace error: ${workspace.error}`);
        };
      }
      
      // Header
      const header = document.createElement('div');
      header.className = 'workspace-header';
      
      const label = document.createElement('h3');
      label.className = 'workspace-label';
      label.textContent = workspaceLabel(workspace);
      
      const status = document.createElement('span');
      status.className = `workspace-status ${workspace.status}`;
      const statusKey = `status.${workspace.status || 'unknown'}`;
      status.textContent = i18n.t(statusKey);
      
      header.appendChild(label);
      header.appendChild(status);
      card.appendChild(header);
      
      // Error state
      if (workspace.status === 'error') {
        const errorMsg = document.createElement('div');
        errorMsg.className = 'error-message';
        errorMsg.textContent = workspace.error || 'Unknown error';
        card.appendChild(errorMsg);
        return card;
      }
      
      // AIPOS-260 FIX-1: record-derived true-stage counts per workspace (not the
      // raw claimed/ count the old card labelled "进行中"). Additive key from /api/overview.
      // FIX-2 F-261-3: collapse to three top-level states (已发布/执行中/已闭环),
      // in sync with the workspace detail page; fine-grained stage_counts stays as data.
      const realCounts = workspace.top_level_counts || workspace.stage_counts || {};
      if (workspace.top_level_counts || workspace.stage_counts) {
        const real = document.createElement('div');
        real.className = 'real-progress';
        const realTitle = document.createElement('div');
        realTitle.className = 'real-progress-title';
        realTitle.textContent = i18n.t('card.real_progress');
        real.appendChild(realTitle);
        const threeState = !!workspace.top_level_counts;
        const stages = threeState
          ? ['published', 'executing', 'closed']
          : ['executing', 'delivered', 'auditing', 'verdict_pass', 'verdict_fail', 'closed'];
        const labels = threeState ? {
          published: i18n.t('stage.published'),
          executing: i18n.t('stage.executing'),
          closed: i18n.t('stage.closed'),
        } : {
          executing: i18n.t('stage.executing'),
          delivered: i18n.t('stage.delivered'),
          auditing: i18n.t('stage.auditing'),
          verdict_pass: i18n.t('stage.verdict_pass'),
          verdict_fail: i18n.t('stage.verdict_fail'),
          closed: i18n.t('stage.closed'),
        };
        const pillClass = threeState ? (s) => `rp-pill rp-${s}` : (s) => `rp-pill rp-${s}`;
        const pills = document.createElement('div');
        pills.className = 'real-progress-pills';
        stages.forEach(stage => {
          const n = realCounts[stage] || 0;
          if (!n) return;
          const pill = document.createElement('span');
          pill.className = pillClass(stage);
          pill.textContent = `${labels[stage]} ${n}`;
          pills.appendChild(pill);
        });
        if (!pills.childElementCount) {
          const empty = document.createElement('span');
          empty.className = 'rp-empty';
          empty.textContent = i18n.t('card.real_progress_empty');
          pills.appendChild(empty);
        }
        real.appendChild(pills);
        card.appendChild(real);
      }
      
      // FIX-3 F-261-5: "受阻" anomaly light — rendered ONLY when blocked > 0
      // (zero takes no slot). queue_counts data interface stays untouched; only
      // the old four-count display (待认领/进行中/受阻/已完成, queue raw counts)
      // was removed — the three-state pills above replace it (与 workspace 页同源).
      const blockedCount =
        (workspace.queue_counts && workspace.queue_counts.blocked) || 0;
      if (blockedCount > 0) {
        const signal = document.createElement('div');
        signal.className = 'blocked-signal';
        const dot = document.createElement('span');
        dot.className = 'blocked-dot';
        signal.appendChild(dot);
        const sigText = document.createElement('span');
        sigText.textContent = i18n.t('stage.blocked') + ' ' + blockedCount;
        signal.appendChild(sigText);
        card.appendChild(signal);
      }
      
      // Needs owner
      const needsSection = document.createElement('div');
      needsSection.className = 'needs-owner-section';
      
      const needsTitle = document.createElement('div');
      needsTitle.className = 'needs-owner-title';
      needsTitle.textContent = i18n.t('card.needs_owner');
      needsSection.appendChild(needsTitle);
      
      if (workspace.needs_owner && workspace.needs_owner.length > 0) {
        const list = document.createElement('ul');
        list.className = 'needs-owner-list';
        
        workspace.needs_owner.slice(0, 3).forEach(item => {
          const li = document.createElement('li');
          li.className = 'needs-owner-item';
          li.textContent = `${item.task_id || 'N/A'}: ${item.reason || 'pending review'}`;
          list.appendChild(li);
        });
        
        needsSection.appendChild(list);
        
        if (workspace.needs_owner.length > 3) {
          const more = document.createElement('div');
          more.className = 'needs-owner-item';
          more.style.fontStyle = 'italic';
          more.textContent = `+ ${workspace.needs_owner.length - 3} ${i18n.t('card.more_items')}`;
          needsSection.appendChild(more);
        }
      } else {
        const empty = document.createElement('div');
        empty.className = 'needs-owner-empty';
        empty.textContent = i18n.t('card.needs_owner_empty');
        needsSection.appendChild(empty);
      }
      
      card.appendChild(needsSection);
      
      // Recent activity
      if (workspace.recent_activity) {
        const activity = document.createElement('div');
        activity.className = 'recent-activity';
        
        const label = document.createElement('span');
        label.className = 'activity-label';
        label.textContent = i18n.t('card.recent_activity') + ': ';
        
        const info = document.createElement('span');
        const timestamp = workspace.recent_activity.timestamp 
          ? new Date(workspace.recent_activity.timestamp).toLocaleString()
          : 'unknown';
        info.textContent = `${workspace.recent_activity.type || 'activity'} (${timestamp})`;
        
        activity.appendChild(label);
        activity.appendChild(info);
        card.appendChild(activity);
      }
      
      return card;
    }
    
    // AIPOS-277: Add Project modal logic
    const addProjectBtn = document.getElementById('add-project-btn');
    const modal = document.getElementById('add-project-modal');
    const modalClose = document.getElementById('modal-close');
    const projectNameInput = document.getElementById('project-name-input');
    const projectNameEnInput = document.getElementById('project-name-en-input');
    const initCommandEl = document.getElementById('init-command');
    const copyInitBtn = document.getElementById('copy-init-btn');
    const serverInitBtn = document.getElementById('server-init-btn');
    const serverInitResult = document.getElementById('server-init-result');

    function openAddProjectModal() {
      modal.hidden = false;
      projectNameInput.value = '';
      projectNameEnInput.value = '';
      projectNameInput.focus();
      updateInitCommand();
      serverInitResult.hidden = true;
      // AIPOS-293 S4: Reset Option C state
      importWorkspacePath.value = '';
      importPreviewResult.hidden = true;
      importFinalResult.hidden = true;
      confirmImportBtn.disabled = true;
      importPreviewData = null;
    }

    function closeAddProjectModal() {
      modal.hidden = true;
    }

    function updateInitCommand() {
      const projectName = projectNameInput.value.trim() || 'my-project';
      const defaultPath = `~/.lybra/workspaces/${projectName}/`;
      initCommandEl.textContent = `lybra init ${defaultPath} --project-id ${projectName}`;
      serverInitBtn.disabled = !projectName || projectName === 'my-project';
    }

    async function copyInitCommand() {
      const command = initCommandEl.textContent;
      try {
        await navigator.clipboard.writeText(command);
        const btnText = document.getElementById('copy-btn-text');
        btnText.textContent = i18n.t('overview.copied') || 'Copied!';
        copyInitBtn.classList.add('copied');
        setTimeout(() => {
          btnText.textContent = i18n.t('overview.copy') || 'Copy';
          copyInitBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        alert('Failed to copy: ' + err.message);
      }
    }

    async function serverSideInit() {
      const projectName = projectNameInput.value.trim();
      const projectNameEn = projectNameEnInput.value.trim();
      if (!projectName || !/^[a-z0-9_-]+$/.test(projectName)) {
        serverInitResult.textContent = 'Invalid project name. Use lowercase letters, numbers, dash, or underscore only.';
        serverInitResult.className = 'result-message error';
        serverInitResult.hidden = false;
        return;
      }

      serverInitBtn.disabled = true;
      serverInitResult.textContent = i18n.t('overview.initializing') || 'Initializing workspace...';
      serverInitResult.className = 'result-message info';
      serverInitResult.hidden = false;

      try {
        // AIPOS-288 FIX-5: Include label_en if provided
        const payload = { project_id: projectName };
        if (projectNameEn) {
          payload.label_en = projectNameEn;
        }
        const response = await fetch('/api/workspace/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();

        if (data.ok) {
          serverInitResult.textContent = i18n.t('overview.init_success') || 'Workspace created successfully! Refreshing...';
          serverInitResult.className = 'result-message success';
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        } else {
          serverInitResult.textContent = `Error: ${data.message || data.error || 'Unknown error'}`;
          serverInitResult.className = 'result-message error';
          serverInitBtn.disabled = false;
        }
      } catch (err) {
        serverInitResult.textContent = `Failed: ${err.message}`;
        serverInitResult.className = 'result-message error';
        serverInitBtn.disabled = false;
      }
    }

    // AIPOS-293 S4 + FIX-1: Option C - Import existing project (dual mode)
    const previewImportBtn = document.getElementById('preview-import-btn');
    const confirmImportBtn = document.getElementById('confirm-import-btn');
    const importWorkspacePath = document.getElementById('import-workspace-path');
    const importStructureFilePath = document.getElementById('import-structure-file-path');
    const importStructureFileUpload = document.getElementById('import-structure-file-upload');
    const importPreviewResult = document.getElementById('import-preview-result');
    const importFinalResult = document.getElementById('import-final-result');
    const importModeDirectory = document.getElementById('import-mode-directory');
    const importModeFile = document.getElementById('import-mode-file');
    const importModeDirectoryPanel = document.getElementById('import-mode-directory-panel');
    const importModeFilePanel = document.getElementById('import-mode-file-panel');
    const importYamlHint = document.getElementById('import-yaml-hint');
    let importPreviewData = null;

    // Get current import mode
    function getImportMode() {
      return importModeFile.checked ? 'file' : 'directory';
    }

    // Mode toggle: show/hide panels
    function updateImportModeUI() {
      const mode = getImportMode();
      if (mode === 'file') {
        importModeDirectoryPanel.style.display = 'none';
        importModeFilePanel.style.display = '';
      } else {
        importModeDirectoryPanel.style.display = '';
        importModeFilePanel.style.display = 'none';
      }
      importYamlHint.style.display = 'none';
    }

    importModeDirectory.addEventListener('change', updateImportModeUI);
    importModeFile.addEventListener('change', updateImportModeUI);

    // Smart hint: if user types .yaml/.yml in directory input, suggest switching to file mode
    importWorkspacePath.addEventListener('input', () => {
      const val = importWorkspacePath.value.trim();
      if (val.endsWith('.yaml') || val.endsWith('.yml')) {
        importYamlHint.style.display = '';
      } else {
        importYamlHint.style.display = 'none';
      }
    });

    // File upload: when user selects a file, populate the path input
    importStructureFileUpload.addEventListener('change', () => {
      const file = importStructureFileUpload.files[0];
      if (file) {
        importStructureFilePath.value = file.name;
      }
    });

    // Humanized error display: map error_code to i18n message
    function humanizeError(data, fallbackLang) {
      const lang = fallbackLang || i18n.getCurrentLang();
      const errorDetail = data.error_detail || '';
      const i18nKey = data.error_i18n_key;

      // Try i18n key first
      if (i18nKey) {
        const msg = i18n.t(i18nKey);
        // If i18n returned the key itself (not found), fall back to detail
        if (msg !== i18nKey) {
          return msg.replace('{detail}', errorDetail);
        }
      }

      // Fallback: use error_detail with actionable suggestion
      if (errorDetail) {
        return errorDetail;
      }

      // Last resort (should never happen with FIX-1)
      return i18n.t('error.import.unexpected_error').replace('{detail}', '');
    }

    async function previewImport() {
      const mode = getImportMode();
      const payload = { mode };

      if (mode === 'file') {
        const filePath = importStructureFilePath.value.trim();
        if (!filePath) {
          importPreviewResult.textContent = i18n.t('overview.new_project_modal.import_path_required') || 'Please enter a structure file path';
          importPreviewResult.className = 'result-message error';
          importPreviewResult.hidden = false;
          return;
        }
        payload.structure_file_path = filePath;
      } else {
        const wsPath = importWorkspacePath.value.trim();
        if (!wsPath) {
          importPreviewResult.textContent = i18n.t('overview.new_project_modal.import_path_required') || 'Please enter a workspace path';
          importPreviewResult.className = 'result-message error';
          importPreviewResult.hidden = false;
          return;
        }
        payload.workspace_path = wsPath;
      }

      previewImportBtn.disabled = true;
      importPreviewResult.textContent = i18n.t('overview.new_project_modal.previewing') || 'Scanning...';
      importPreviewResult.className = 'result-message info';
      importPreviewResult.hidden = false;
      importFinalResult.hidden = true;
      confirmImportBtn.disabled = true;
      importPreviewData = null;

      try {
        const response = await fetch('/api/project-structure/preview', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        const lang = i18n.getCurrentLang();
        if (data.ok) {
          importPreviewData = data;
          const lines = [];
          const sourceLabel = mode === 'file'
            ? i18n.t('overview.new_project_modal.preview_file_loaded')
            : i18n.t('overview.new_project_modal.preview_workspace_found');
          lines.push(sourceLabel);
          lines.push(`  ${i18n.t('overview.new_project_modal.preview_field_project')}: ${data.project_name || '?'}`);
          if (data.description) lines.push(`  ${i18n.t('overview.new_project_modal.preview_field_description')}: ${data.description}`);
          lines.push(`  ${i18n.t('overview.new_project_modal.preview_field_documents')}: ${data.doc_count}`);
          if (data.code_repos && data.code_repos.length > 0) {
            lines.push(`  ${i18n.t('overview.new_project_modal.preview_field_code_repos')}: ${data.code_repos.join(', ')}`);
          }
          if (data.governance_files && data.governance_files.length > 0) {
            lines.push(`  ${i18n.t('overview.new_project_modal.preview_field_governance')}: ${data.governance_files.join(', ')}`);
          }
          lines.push('');
          lines.push(i18n.t('overview.new_project_modal.preview_instruction'));
          importPreviewResult.textContent = lines.join('\n');
          importPreviewResult.className = 'result-message success';
          importPreviewResult.style.whiteSpace = 'pre-line';
          confirmImportBtn.disabled = false;
        } else {
          const errorMsg = humanizeError(data, lang);
          let extraHint = '';
          if (data.suggest_file_mode) {
            extraHint = i18n.t('overview.new_project_modal.suggest_file_mode_hint');
          }
          importPreviewResult.textContent = `${i18n.t('overview.new_project_modal.preview_error_prefix')}: ${errorMsg}${extraHint}`;
          importPreviewResult.className = 'result-message error';
        }
      } catch (err) {
        importPreviewResult.textContent = `Failed: ${err.message}`;
        importPreviewResult.className = 'result-message error';
      }
      previewImportBtn.disabled = false;
    }

    async function confirmImport() {
      const mode = getImportMode();
      const projectName = projectNameInput.value.trim();
      const projectNameEn = projectNameEnInput.value.trim();

      // Validate path based on mode
      if (mode === 'file') {
        const filePath = importStructureFilePath.value.trim();
        if (!filePath) {
          importFinalResult.textContent = i18n.t('overview.new_project_modal.import_path_required') || 'Please enter a structure file path';
          importFinalResult.className = 'result-message error';
          importFinalResult.hidden = false;
          return;
        }
      } else {
        const wsPath = importWorkspacePath.value.trim();
        if (!wsPath) {
          importFinalResult.textContent = i18n.t('overview.new_project_modal.import_path_required') || 'Please enter a workspace path';
          importFinalResult.className = 'result-message error';
          importFinalResult.hidden = false;
          return;
        }
      }

      if (!projectName) {
        importFinalResult.textContent = i18n.t('overview.new_project_modal.need_project_name') || 'Please enter a project name above';
        importFinalResult.className = 'result-message error';
        importFinalResult.hidden = false;
        return;
      }
      if (!/^[a-z0-9_-]+$/.test(projectName)) {
        importFinalResult.textContent = i18n.t('overview.new_project_modal.invalid_name') || 'Invalid project name. Use lowercase letters, numbers, dash, or underscore only.';
        importFinalResult.className = 'result-message error';
        importFinalResult.hidden = false;
        return;
      }
      confirmImportBtn.disabled = true;
      importFinalResult.textContent = i18n.t('overview.new_project_modal.importing') || 'Importing workspace...';
      importFinalResult.className = 'result-message info';
      importFinalResult.hidden = false;

      try {
        const payload = { mode, project_id: projectName };
        if (mode === 'file') {
          payload.structure_file_path = importStructureFilePath.value.trim();
        } else {
          payload.workspace_path = importWorkspacePath.value.trim();
        }
        if (projectNameEn) payload.label_en = projectNameEn;
        const response = await fetch('/api/project-structure/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        const lang = i18n.getCurrentLang();
        if (data.ok) {
          importFinalResult.textContent = i18n.t('overview.new_project_modal.import_success') || 'Workspace imported successfully! Refreshing...';
          importFinalResult.className = 'result-message success';
          setTimeout(() => { window.location.reload(); }, 1500);
        } else {
          const errorMsg = humanizeError(data, lang);
          let extraHint = '';
          if (data.suggest_file_mode) {
            extraHint = i18n.t('overview.new_project_modal.suggest_file_mode_hint');
          }
          importFinalResult.textContent = `${i18n.t('overview.new_project_modal.preview_error_prefix')}: ${errorMsg}${extraHint}`;
          importFinalResult.className = 'result-message error';
          confirmImportBtn.disabled = false;
        }
      } catch (err) {
        importFinalResult.textContent = `Failed: ${err.message}`;
        importFinalResult.className = 'result-message error';
        confirmImportBtn.disabled = false;
      }
    }

    previewImportBtn.addEventListener('click', previewImport);
    confirmImportBtn.addEventListener('click', confirmImport);
    importWorkspacePath.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') previewImport();
    });
    importStructureFilePath.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') previewImport();
    });

    addProjectBtn.addEventListener('click', openAddProjectModal);
    modalClose.addEventListener('click', closeAddProjectModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeAddProjectModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) closeAddProjectModal();
    });
    projectNameInput.addEventListener('input', updateInitCommand);
    copyInitBtn.addEventListener('click', copyInitCommand);
    serverInitBtn.addEventListener('click', serverSideInit);

    // Load on page ready
    renderPage();
  </script>
  <script src="/auth-chrome.js"></script>
</body>
</html>
