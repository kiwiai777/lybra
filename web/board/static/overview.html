<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lybra Overview — Multi-Workspace Dashboard</title>
  <link rel="stylesheet" href="/overview.css">
  <link rel="stylesheet" href="/i18n.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <img src="/assets/lybra_logo_white.png" alt="Lybra" class="brand-logo">
      <div style="flex: 1;">
        <h1 class="brand-title" id="page-title">Lybra Overview</h1>
        <p class="brand-subtitle" id="page-subtitle">Multi-workspace command center</p>
      </div>
      <div id="lang-switcher-mount"></div>
      <div id="auth-chrome-mount"></div>
    </div>
  </header>

  <main>
    <div class="kicker">
      <div class="kicker-box"></div>
      <span class="kicker-text" id="kicker-text">Workspaces</span>
    </div>
    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
      <h2 class="section-title" id="section-title" style="margin-bottom: 0;">All Projects</h2>
      <button id="add-project-btn" class="add-project-btn" title="Add new project" aria-label="Add new project">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span id="add-project-text"></span>
      </button>
    </div>
    
    <div id="workspace-grid" class="workspace-grid" data-owner-truth="overview">
      <div class="loading">Loading workspaces...</div>
    </div>

    <!-- AIPOS-277: New Project Panel (modal) -->
    <div id="add-project-modal" class="modal-mask" hidden>
      <div class="modal-panel">
        <div class="modal-header">
          <h3 id="modal-title"></h3>
          <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p id="modal-intro"></p>
          
          <div class="input-group">
            <label for="project-name-input" id="project-name-label"></label>
            <input type="text" id="project-name-input" placeholder="my-project" />
            <div class="input-hint" id="project-name-hint"></div>
          </div>

          <div class="setup-options">
            <!-- Option A: Copy command -->
            <div class="setup-option">
              <div class="option-header">
                <span class="option-badge">A</span>
                <h4 id="option-a-title"></h4>
              </div>
              <p id="option-a-desc"></p>
              <div class="code-block">
                <code id="init-command">lybra init --project-id my-project</code>
                <button id="copy-init-btn" class="copy-btn" title="Copy command">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                  <span id="copy-btn-text"></span>
                </button>
              </div>
            </div>

            <!-- Option B: Server-side init (if serve has file permissions) -->
            <div class="setup-option">
              <div class="option-header">
                <span class="option-badge">B</span>
                <h4 id="option-b-title"></h4>
              </div>
              <p id="option-b-desc"></p>
              <button id="server-init-btn" class="action-btn" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 5v14M5 12l7 7 7-7"></path>
                </svg>
                <span id="server-init-text"></span>
              </button>
              <div id="server-init-result" class="result-message" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script>
    // Render page with i18n
    function renderPage() {
      // Update static text
      document.getElementById('page-title').textContent = i18n.t('overview.title');
      document.getElementById('page-subtitle').textContent = i18n.t('overview.subtitle');
      document.getElementById('kicker-text').textContent = i18n.t('overview.workspaces');
      document.getElementById('section-title').textContent = i18n.t('overview.all_projects');
      document.getElementById('add-project-text').textContent = i18n.t('overview.add_project');
      
      // Modal i18n
      document.getElementById('modal-title').textContent = i18n.t('overview.new_project_modal.title');
      document.getElementById('modal-intro').textContent = i18n.t('overview.new_project_modal.intro');
      document.getElementById('project-name-label').textContent = i18n.t('overview.new_project_modal.project_name');
      document.getElementById('project-name-hint').textContent = i18n.t('overview.new_project_modal.project_name_hint');
      document.getElementById('option-a-title').textContent = i18n.t('overview.new_project_modal.option_a');
      document.getElementById('option-a-desc').textContent = i18n.t('overview.new_project_modal.option_a_desc');
      document.getElementById('option-b-title').textContent = i18n.t('overview.new_project_modal.option_b');
      document.getElementById('option-b-desc').textContent = i18n.t('overview.new_project_modal.option_b_desc');
      document.getElementById('copy-btn-text').textContent = i18n.t('overview.copy');
      document.getElementById('server-init-text').textContent = i18n.t('overview.init_now');
      
      // Mount language switcher
      const switcherMount = document.getElementById('lang-switcher-mount');
      switcherMount.innerHTML = '';
      switcherMount.appendChild(i18n.createLanguageSwitcher());
      
      // Reload data
      loadOverview();
    }
    
    // Fetch and render workspace overview
    async function loadOverview() {
      const grid = document.getElementById('workspace-grid');
      
      try {
        const response = await fetch('/api/overview');
        const data = await response.json();
        
        if (!data.ok || !data.workspaces || data.workspaces.length === 0) {
          grid.innerHTML = `<div class="loading">${i18n.t('overview.no_workspaces')}</div>`;
          return;
        }
        
        grid.innerHTML = '';
        
        data.workspaces.forEach((ws, index) => {
          const card = createWorkspaceCard(ws, index);
          grid.appendChild(card);
        });
        
      } catch (error) {
        grid.innerHTML = `<div class="loading">${i18n.t('overview.error')}: ${error.message}</div>`;
      }
    }
    
    function createWorkspaceCard(workspace, index) {
      const card = document.createElement('a');
      card.className = 'workspace-card';
      card.href = `/workspace/${index}`; // Links to new project-detail page
      
      if (workspace.status === 'error') {
        card.className += ' error';
        card.onclick = (e) => {
          e.preventDefault();
          alert(`Workspace error: ${workspace.error}`);
        };
      }
      
      // Header
      const header = document.createElement('div');
      header.className = 'workspace-header';
      
      const label = document.createElement('h3');
      label.className = 'workspace-label';
      label.textContent = workspace.label || 'Unnamed Workspace';
      
      const status = document.createElement('span');
      status.className = `workspace-status ${workspace.status}`;
      const statusKey = `status.${workspace.status || 'unknown'}`;
      status.textContent = i18n.t(statusKey);
      
      header.appendChild(label);
      header.appendChild(status);
      card.appendChild(header);
      
      // Error state
      if (workspace.status === 'error') {
        const errorMsg = document.createElement('div');
        errorMsg.className = 'error-message';
        errorMsg.textContent = workspace.error || 'Unknown error';
        card.appendChild(errorMsg);
        return card;
      }
      
      // AIPOS-260 FIX-1: record-derived true-stage counts per workspace (not the
      // raw claimed/ count the old card labelled "进行中"). Additive key from /api/overview.
      // FIX-2 F-261-3: collapse to three top-level states (已发布/执行中/已闭环),
      // in sync with the workspace detail page; fine-grained stage_counts stays as data.
      const realCounts = workspace.top_level_counts || workspace.stage_counts || {};
      if (workspace.top_level_counts || workspace.stage_counts) {
        const real = document.createElement('div');
        real.className = 'real-progress';
        const realTitle = document.createElement('div');
        realTitle.className = 'real-progress-title';
        realTitle.textContent = i18n.t('card.real_progress');
        real.appendChild(realTitle);
        const threeState = !!workspace.top_level_counts;
        const stages = threeState
          ? ['published', 'executing', 'closed']
          : ['executing', 'delivered', 'auditing', 'verdict_pass', 'verdict_fail', 'closed'];
        const labels = threeState ? {
          published: i18n.t('stage.published'),
          executing: i18n.t('stage.executing'),
          closed: i18n.t('stage.closed'),
        } : {
          executing: i18n.t('stage.executing'),
          delivered: i18n.t('stage.delivered'),
          auditing: i18n.t('stage.auditing'),
          verdict_pass: i18n.t('stage.verdict_pass'),
          verdict_fail: i18n.t('stage.verdict_fail'),
          closed: i18n.t('stage.closed'),
        };
        const pillClass = threeState ? (s) => `rp-pill rp-${s}` : (s) => `rp-pill rp-${s}`;
        const pills = document.createElement('div');
        pills.className = 'real-progress-pills';
        stages.forEach(stage => {
          const n = realCounts[stage] || 0;
          if (!n) return;
          const pill = document.createElement('span');
          pill.className = pillClass(stage);
          pill.textContent = `${labels[stage]} ${n}`;
          pills.appendChild(pill);
        });
        if (!pills.childElementCount) {
          const empty = document.createElement('span');
          empty.className = 'rp-empty';
          empty.textContent = i18n.t('card.real_progress_empty');
          pills.appendChild(empty);
        }
        real.appendChild(pills);
        card.appendChild(real);
      }
      
      // FIX-3 F-261-5: "受阻" anomaly light — rendered ONLY when blocked > 0
      // (zero takes no slot). queue_counts data interface stays untouched; only
      // the old four-count display (待认领/进行中/受阻/已完成, queue raw counts)
      // was removed — the three-state pills above replace it (与 workspace 页同源).
      const blockedCount =
        (workspace.queue_counts && workspace.queue_counts.blocked) || 0;
      if (blockedCount > 0) {
        const signal = document.createElement('div');
        signal.className = 'blocked-signal';
        const dot = document.createElement('span');
        dot.className = 'blocked-dot';
        signal.appendChild(dot);
        const sigText = document.createElement('span');
        sigText.textContent = i18n.t('stage.blocked') + ' ' + blockedCount;
        signal.appendChild(sigText);
        card.appendChild(signal);
      }
      
      // Needs owner
      const needsSection = document.createElement('div');
      needsSection.className = 'needs-owner-section';
      
      const needsTitle = document.createElement('div');
      needsTitle.className = 'needs-owner-title';
      needsTitle.textContent = i18n.t('card.needs_owner');
      needsSection.appendChild(needsTitle);
      
      if (workspace.needs_owner && workspace.needs_owner.length > 0) {
        const list = document.createElement('ul');
        list.className = 'needs-owner-list';
        
        workspace.needs_owner.slice(0, 3).forEach(item => {
          const li = document.createElement('li');
          li.className = 'needs-owner-item';
          li.textContent = `${item.task_id || 'N/A'}: ${item.reason || 'pending review'}`;
          list.appendChild(li);
        });
        
        needsSection.appendChild(list);
        
        if (workspace.needs_owner.length > 3) {
          const more = document.createElement('div');
          more.className = 'needs-owner-item';
          more.style.fontStyle = 'italic';
          more.textContent = `+ ${workspace.needs_owner.length - 3} ${i18n.t('card.more_items')}`;
          needsSection.appendChild(more);
        }
      } else {
        const empty = document.createElement('div');
        empty.className = 'needs-owner-empty';
        empty.textContent = i18n.t('card.needs_owner_empty');
        needsSection.appendChild(empty);
      }
      
      card.appendChild(needsSection);
      
      // Recent activity
      if (workspace.recent_activity) {
        const activity = document.createElement('div');
        activity.className = 'recent-activity';
        
        const label = document.createElement('span');
        label.className = 'activity-label';
        label.textContent = i18n.t('card.recent_activity') + ': ';
        
        const info = document.createElement('span');
        const timestamp = workspace.recent_activity.timestamp 
          ? new Date(workspace.recent_activity.timestamp).toLocaleString()
          : 'unknown';
        info.textContent = `${workspace.recent_activity.type || 'activity'} (${timestamp})`;
        
        activity.appendChild(label);
        activity.appendChild(info);
        card.appendChild(activity);
      }
      
      return card;
    }
    
    // AIPOS-277: Add Project modal logic
    const addProjectBtn = document.getElementById('add-project-btn');
    const modal = document.getElementById('add-project-modal');
    const modalClose = document.getElementById('modal-close');
    const projectNameInput = document.getElementById('project-name-input');
    const initCommandEl = document.getElementById('init-command');
    const copyInitBtn = document.getElementById('copy-init-btn');
    const serverInitBtn = document.getElementById('server-init-btn');
    const serverInitResult = document.getElementById('server-init-result');

    function openAddProjectModal() {
      modal.hidden = false;
      projectNameInput.value = '';
      projectNameInput.focus();
      updateInitCommand();
      serverInitResult.hidden = true;
    }

    function closeAddProjectModal() {
      modal.hidden = true;
    }

    function updateInitCommand() {
      const projectName = projectNameInput.value.trim() || 'my-project';
      const defaultPath = `~/.lybra/workspaces/${projectName}/`;
      initCommandEl.textContent = `lybra init ${defaultPath} --project-id ${projectName}`;
      serverInitBtn.disabled = !projectName || projectName === 'my-project';
    }

    async function copyInitCommand() {
      const command = initCommandEl.textContent;
      try {
        await navigator.clipboard.writeText(command);
        const btnText = document.getElementById('copy-btn-text');
        btnText.textContent = i18n.t('overview.copied') || 'Copied!';
        copyInitBtn.classList.add('copied');
        setTimeout(() => {
          btnText.textContent = i18n.t('overview.copy') || 'Copy';
          copyInitBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        alert('Failed to copy: ' + err.message);
      }
    }

    async function serverSideInit() {
      const projectName = projectNameInput.value.trim();
      if (!projectName || !/^[a-z0-9_-]+$/.test(projectName)) {
        serverInitResult.textContent = 'Invalid project name. Use lowercase letters, numbers, dash, or underscore only.';
        serverInitResult.className = 'result-message error';
        serverInitResult.hidden = false;
        return;
      }

      serverInitBtn.disabled = true;
      serverInitResult.textContent = i18n.t('overview.initializing') || 'Initializing workspace...';
      serverInitResult.className = 'result-message info';
      serverInitResult.hidden = false;

      try {
        const response = await fetch('/api/workspace/init', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ project_id: projectName })
        });
        const data = await response.json();

        if (data.ok) {
          serverInitResult.textContent = i18n.t('overview.init_success') || 'Workspace created successfully! Refreshing...';
          serverInitResult.className = 'result-message success';
          setTimeout(() => {
            window.location.reload();
          }, 1500);
        } else {
          serverInitResult.textContent = `Error: ${data.message || data.error || 'Unknown error'}`;
          serverInitResult.className = 'result-message error';
          serverInitBtn.disabled = false;
        }
      } catch (err) {
        serverInitResult.textContent = `Failed: ${err.message}`;
        serverInitResult.className = 'result-message error';
        serverInitBtn.disabled = false;
      }
    }

    addProjectBtn.addEventListener('click', openAddProjectModal);
    modalClose.addEventListener('click', closeAddProjectModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeAddProjectModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) closeAddProjectModal();
    });
    projectNameInput.addEventListener('input', updateInitCommand);
    copyInitBtn.addEventListener('click', copyInitCommand);
    serverInitBtn.addEventListener('click', serverSideInit);

    // Load on page ready
    renderPage();
  </script>
  <script src="/auth-chrome.js"></script>
</body>
</html>
