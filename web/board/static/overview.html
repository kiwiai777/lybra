<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lybra Overview — Multi-Workspace Dashboard</title>
  <link rel="stylesheet" href="/overview.css">
  <link rel="stylesheet" href="/i18n.css">
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <img src="/assets/lybra_logo_white.png" alt="Lybra" class="brand-logo">
      <div style="flex: 1;">
        <h1 class="brand-title" id="page-title">Lybra Overview</h1>
        <p class="brand-subtitle" id="page-subtitle">Multi-workspace command center</p>
      </div>
      <div id="lang-switcher-mount"></div>
    </div>
  </header>

  <main>
    <div class="kicker">
      <div class="kicker-box"></div>
      <span class="kicker-text" id="kicker-text">Workspaces</span>
    </div>
    <h2 class="section-title" id="section-title">All Projects</h2>
    
    <div id="workspace-grid" class="workspace-grid" data-owner-truth="overview">
      <div class="loading">Loading workspaces...</div>
    </div>
  </main>

  <script src="/i18n.js"></script>
  <script>
    // Render page with i18n
    function renderPage() {
      // Update static text
      document.getElementById('page-title').textContent = i18n.t('overview.title');
      document.getElementById('page-subtitle').textContent = i18n.t('overview.subtitle');
      document.getElementById('kicker-text').textContent = i18n.t('overview.workspaces');
      document.getElementById('section-title').textContent = i18n.t('overview.all_projects');
      
      // Mount language switcher
      const switcherMount = document.getElementById('lang-switcher-mount');
      switcherMount.innerHTML = '';
      switcherMount.appendChild(i18n.createLanguageSwitcher());
      
      // Reload data
      loadOverview();
    }
    
    // Fetch and render workspace overview
    async function loadOverview() {
      const grid = document.getElementById('workspace-grid');
      
      try {
        const response = await fetch('/api/overview');
        const data = await response.json();
        
        if (!data.ok || !data.workspaces || data.workspaces.length === 0) {
          grid.innerHTML = `<div class="loading">${i18n.t('overview.no_workspaces')}</div>`;
          return;
        }
        
        grid.innerHTML = '';
        
        data.workspaces.forEach((ws, index) => {
          const card = createWorkspaceCard(ws, index);
          grid.appendChild(card);
        });
        
      } catch (error) {
        grid.innerHTML = `<div class="loading">${i18n.t('overview.error')}: ${error.message}</div>`;
      }
    }
    
    function createWorkspaceCard(workspace, index) {
      const card = document.createElement('a');
      card.className = 'workspace-card';
      card.href = `/workspace/${index}`; // Links to new project-detail page
      
      if (workspace.status === 'error') {
        card.className += ' error';
        card.onclick = (e) => {
          e.preventDefault();
          alert(`Workspace error: ${workspace.error}`);
        };
      }
      
      // Header
      const header = document.createElement('div');
      header.className = 'workspace-header';
      
      const label = document.createElement('h3');
      label.className = 'workspace-label';
      label.textContent = workspace.label || 'Unnamed Workspace';
      
      const status = document.createElement('span');
      status.className = `workspace-status ${workspace.status}`;
      const statusKey = `status.${workspace.status || 'unknown'}`;
      status.textContent = i18n.t(statusKey);
      
      header.appendChild(label);
      header.appendChild(status);
      card.appendChild(header);
      
      // Error state
      if (workspace.status === 'error') {
        const errorMsg = document.createElement('div');
        errorMsg.className = 'error-message';
        errorMsg.textContent = workspace.error || 'Unknown error';
        card.appendChild(errorMsg);
        return card;
      }
      
      // AIPOS-260 FIX-1: record-derived true-stage counts per workspace (not the
      // raw claimed/ count the old card labelled "进行中"). Additive key from /api/overview.
      // FIX-2 F-261-3: collapse to three top-level states (已发布/执行中/已闭环),
      // in sync with the workspace detail page; fine-grained stage_counts stays as data.
      const realCounts = workspace.top_level_counts || workspace.stage_counts || {};
      if (workspace.top_level_counts || workspace.stage_counts) {
        const real = document.createElement('div');
        real.className = 'real-progress';
        const realTitle = document.createElement('div');
        realTitle.className = 'real-progress-title';
        realTitle.textContent = i18n.t('card.real_progress');
        real.appendChild(realTitle);
        const threeState = !!workspace.top_level_counts;
        const stages = threeState
          ? ['published', 'executing', 'closed']
          : ['executing', 'delivered', 'auditing', 'verdict_pass', 'verdict_fail', 'closed'];
        const labels = threeState ? {
          published: i18n.t('stage.published'),
          executing: i18n.t('stage.executing'),
          closed: i18n.t('stage.closed'),
        } : {
          executing: i18n.t('stage.executing'),
          delivered: i18n.t('stage.delivered'),
          auditing: i18n.t('stage.auditing'),
          verdict_pass: i18n.t('stage.verdict_pass'),
          verdict_fail: i18n.t('stage.verdict_fail'),
          closed: i18n.t('stage.closed'),
        };
        const pillClass = threeState ? (s) => `rp-pill rp-${s}` : (s) => `rp-pill rp-${s}`;
        const pills = document.createElement('div');
        pills.className = 'real-progress-pills';
        stages.forEach(stage => {
          const n = realCounts[stage] || 0;
          if (!n) return;
          const pill = document.createElement('span');
          pill.className = pillClass(stage);
          pill.textContent = `${labels[stage]} ${n}`;
          pills.appendChild(pill);
        });
        if (!pills.childElementCount) {
          const empty = document.createElement('span');
          empty.className = 'rp-empty';
          empty.textContent = i18n.t('card.real_progress_empty');
          pills.appendChild(empty);
        }
        real.appendChild(pills);
        card.appendChild(real);
      }
      
      // FIX-3 F-261-5: "受阻" anomaly light — rendered ONLY when blocked > 0
      // (zero takes no slot). queue_counts data interface stays untouched; only
      // the old four-count display (待认领/进行中/受阻/已完成, queue raw counts)
      // was removed — the three-state pills above replace it (与 workspace 页同源).
      const blockedCount =
        (workspace.queue_counts && workspace.queue_counts.blocked) || 0;
      if (blockedCount > 0) {
        const signal = document.createElement('div');
        signal.className = 'blocked-signal';
        const dot = document.createElement('span');
        dot.className = 'blocked-dot';
        signal.appendChild(dot);
        const sigText = document.createElement('span');
        sigText.textContent = i18n.t('stage.blocked') + ' ' + blockedCount;
        signal.appendChild(sigText);
        card.appendChild(signal);
      }
      
      // Needs owner
      const needsSection = document.createElement('div');
      needsSection.className = 'needs-owner-section';
      
      const needsTitle = document.createElement('div');
      needsTitle.className = 'needs-owner-title';
      needsTitle.textContent = i18n.t('card.needs_owner');
      needsSection.appendChild(needsTitle);
      
      if (workspace.needs_owner && workspace.needs_owner.length > 0) {
        const list = document.createElement('ul');
        list.className = 'needs-owner-list';
        
        workspace.needs_owner.slice(0, 3).forEach(item => {
          const li = document.createElement('li');
          li.className = 'needs-owner-item';
          li.textContent = `${item.task_id || 'N/A'}: ${item.reason || 'pending review'}`;
          list.appendChild(li);
        });
        
        needsSection.appendChild(list);
        
        if (workspace.needs_owner.length > 3) {
          const more = document.createElement('div');
          more.className = 'needs-owner-item';
          more.style.fontStyle = 'italic';
          more.textContent = `+ ${workspace.needs_owner.length - 3} ${i18n.t('card.more_items')}`;
          needsSection.appendChild(more);
        }
      } else {
        const empty = document.createElement('div');
        empty.className = 'needs-owner-empty';
        empty.textContent = i18n.t('card.needs_owner_empty');
        needsSection.appendChild(empty);
      }
      
      card.appendChild(needsSection);
      
      // Recent activity
      if (workspace.recent_activity) {
        const activity = document.createElement('div');
        activity.className = 'recent-activity';
        
        const label = document.createElement('span');
        label.className = 'activity-label';
        label.textContent = i18n.t('card.recent_activity') + ': ';
        
        const info = document.createElement('span');
        const timestamp = workspace.recent_activity.timestamp 
          ? new Date(workspace.recent_activity.timestamp).toLocaleString()
          : 'unknown';
        info.textContent = `${workspace.recent_activity.type || 'activity'} (${timestamp})`;
        
        activity.appendChild(label);
        activity.appendChild(info);
        card.appendChild(activity);
      }
      
      return card;
    }
    
    // Load on page ready
    renderPage();
  </script>
</body>
</html>
