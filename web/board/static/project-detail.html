<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目详情 - Lybra</title>
  <link rel="stylesheet" href="/overview.css">
  <link rel="stylesheet" href="/i18n.css">
  <style>
    /* Project detail page specific styles */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent-bright);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    
    .back-link:hover {
      color: var(--accent);
    }
    
    .project-header {
      margin-bottom: 2.5rem;
    }
    
    .project-title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-body);
      margin-bottom: 0.5rem;
    }
    
    .project-status-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      background: var(--accent-bright);
      color: white;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
    }
    
    /* Section styles */
    .detail-section {
      background: var(--surface-card);
      border: 1px solid var(--border-default);
      border-left: 4px solid var(--accent);
      padding: 1.75rem 2rem;
      margin-bottom: 1.5rem;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border-default);
    }
    
    .section-header h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-body);
    }
    
    /* Progress grid */
    .progress-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.25rem;
    }
    
    .progress-item {
      text-align: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.02);
      border-radius: 6px;
    }
    
    .progress-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    
    .progress-label {
      font-size: 13px;
      color: var(--text-secondary);
    }
    
    /* Needs owner list */
    .needs-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .needs-item {
      padding: 1rem 1.25rem;
      background: rgba(0, 0, 0, 0.02);
      border-left: 3px solid var(--accent-bright);
      border-radius: 4px;
    }
    
    .needs-item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.5rem;
    }
    
    .needs-task-id {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-body);
    }
    
    .needs-reason {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }
    
    .needs-command {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 4px;
      font-family: monospace;
      font-size: 12.5px;
      color: var(--text-body);
    }
    
    .copy-button {
      padding: 0.3rem 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .copy-button:hover {
      background: var(--accent-bright);
    }
    
    .copy-button.copied {
      background: #10b981;
    }
    
    /* Timeline */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    
    .timeline-item {
      display: flex;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(0, 0, 0, 0.02);
      border-radius: 4px;
    }
    
    .timeline-time {
      font-size: 12px;
      color: var(--text-secondary);
      min-width: 140px;
      flex-shrink: 0;
    }
    
    .timeline-content {
      flex: 1;
    }
    
    .timeline-type {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.25rem;
    }
    
    .timeline-description {
      font-size: 13.5px;
      color: var(--text-body);
    }
    
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
      font-style: italic;
    }
    
    /* Advanced section */
    .advanced-section {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 2px solid var(--border-default);
    }
    
    .advanced-header {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 1rem;
    }
    
    .debug-link {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-default);
      color: var(--text-body);
      text-decoration: none;
      border-radius: 4px;
      font-size: 13.5px;
      transition: all 0.2s;
    }
    
    .debug-link:hover {
      background: rgba(0, 0, 0, 0.08);
      border-color: var(--accent);
    }
    
    .debug-description {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    /* ===== AIPOS-260 FIX-1: 任务中心 (Owner truth summary) ===== */
    .task-center-section { border-left-color: var(--accent); }
    .section-hint {
      margin: 0 0 12px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.55;
    }
    .tc-subheading {
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-body);
    }
    /* True-stage pills (record-derived counts). */
    .tc-stage-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .stage-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(0,0,0,0.04);
      color: var(--text-body);
    }
    .stage-pill .stage-num { font-weight: 800; }
    /* FIX-2 F-261-3: three top-level state pill colors (已发布/执行中/已闭环). */
    .stage-pill.is-published { background: #e0e7ff; color: #3730a3; }
    .stage-pill.is-executing { background: #dbeafe; color: #1e3a8a; }
    .stage-pill.is-delivered { background: #fef3c7; color: #92400e; }
    .stage-pill.is-auditing { background: #ede9fe; color: #5b21b6; }
    .stage-pill.is-verdict_pass { background: #dcfce7; color: #166534; }
    .stage-pill.is-verdict_fail { background: #fee2e2; color: #991b1b; }
    .stage-pill.is-closed { background: #cffafe; color: #155e75; }
    /* Task cards. */
    .tc-tasks { display: grid; gap: 10px; }
    .tc-task-card {
      border: 1px solid var(--border-default);
      border-radius: 8px;
      background: var(--surface-card);
      padding: 10px 14px;
    }
    .tc-task-card[open] { border-color: var(--accent); }
    /* FIX-2 F-261-3: dedicated card background per top-level bucket (执行中专属背景色).
       Sub-state stays readable via the badge color + composed label. */
    .tc-task-card.tlc-executing { background: #eff6ff; border-color: #bfdbfe; }
    .tc-task-card.tlc-closed { background: #f0fdfa; border-color: #a5f3fc; }
    .tc-task-card.tlc-published { background: #f5f3ff; border-color: #ddd6fe; }
    .tc-task-head {
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }
    .tc-task-title { font-weight: 600; flex: 1 1 280px; overflow-wrap: anywhere; }
    .tc-task-id {
      font-family: ui-monospace, monospace;
      font-size: 12px; color: var(--text-secondary);
    }
    .stage-badge {
      display: inline-block; padding: 2px 10px; border-radius: 999px;
      font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap;
    }
    /* FIX-3 F-261-6: 已发布 badge purple (was blue #0284c7), matches the violet
       published card background (#f5f3ff) + the home-page rp-published pill. */
    .sb-published { background: #7c3aed; }
    .sb-executing { background: #2563eb; }
    .sb-delivered { background: #d97706; }
    .sb-auditing { background: #7c3aed; }
    .sb-verdict_pass { background: #16a34a; }
    .sb-verdict_fail { background: #dc2626; }
    .sb-closed { background: #0891b2; }
    .sb-pending { background: #94a3b8; }
    .sb-blocked { background: #dc2626; }
    .sb-unknown { background: #94a3b8; }
    .tc-task-body { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border-default); }
    .tc-purpose { margin: 0 0 8px; line-height: 1.55; font-size: 13.5px; }
    .tc-purpose .muted { color: var(--text-secondary); margin-right: 4px; }
    .tc-timeline { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
    .tc-event { border-left: 3px solid var(--border-default); padding: 4px 0 4px 12px; font-size: 13px; }
    .tc-event .ev-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
    .ev-verb { font-weight: 700; color: var(--accent); }
    .ev-actor { font-family: ui-monospace, monospace; color: var(--text-secondary); font-size: 12px; }
    .ev-time { margin-left: auto; color: var(--text-secondary); font-size: 11.5px; }
    .ev-summary { margin-top: 3px; color: var(--text-body); overflow-wrap: anywhere; }
    .ev-empty { color: var(--text-secondary); font-style: italic; font-size: 13px; }
    /* AIPOS-261: 人话化 + agent popup + closure-unit face. */
    .ev-phrase { font-weight: 600; color: var(--text-body); }
    .ev-role { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; background: #eef2ff; color: #3730a3; }
    .ev-role.r-Owner { background: #fef3c7; color: #92400e; }
    .ev-role.r-audit { background: #ede9fe; color: #5b21b6; }
    .agent-link { font-family: ui-monospace, monospace; color: var(--text-secondary); font-size: 11.5px; text-decoration: underline dotted; cursor: pointer; background: none; border: 0; padding: 0; }
    .agent-link:hover { color: var(--accent); }
    .tc-unit-face { font-size: 13px; color: var(--text-body); overflow-wrap: anywhere; }
    .tc-unit-face .chain-pass { color: #166534; font-weight: 600; }
    .tc-unit-face .chain-fail { color: #991b1b; font-weight: 600; }
    .tc-members { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .member-chip { display: inline-flex; gap: 4px; align-items: baseline; padding: 2px 8px; border-radius: 8px; font-size: 11.5px; background: var(--surface); border: 1px solid var(--border-default); }
    .member-chip .mk { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; }
    .member-chip.mk-main { border-color: var(--accent); }
    .member-chip.mk-audit { border-color: #7c3aed; }
    .member-chip.mk-fix { border-color: #d97706; }
    .member-chip.mk-finalize { border-color: #0891b2; }
    /* Agent info popup (modal). */
    .agent-popup-mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .agent-popup { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 12px; padding: 18px 20px; max-width: 420px; width: calc(100% - 32px); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .agent-popup h4 { margin: 0 0 4px; font-size: 15px; }
    .agent-popup .ap-sub { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    .agent-popup .ap-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border-default); font-size: 13px; }
    .agent-popup .ap-row:last-child { border-bottom: none; }
    .agent-popup .ap-k { color: var(--text-secondary); }
    .agent-popup .ap-v { font-weight: 600; overflow-wrap: anywhere; text-align: right; }
    .agent-popup .ap-v.muted { color: var(--text-secondary); font-weight: 400; font-style: italic; }
    .agent-popup .ap-tag { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 700; color: #92400e; background: #fef3c7; padding: 1px 6px; border-radius: 8px; vertical-align: middle; }
    .agent-popup .ap-close { margin-top: 12px; width: 100%; padding: 7px; border: 1px solid var(--border-default); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 13px; }
    /* Activity feed. */
    .tc-feed {
      border: 1px solid var(--border-default); border-radius: 8px;
      background: var(--surface-card); padding: 10px; max-height: 460px; overflow-y: auto;
    }
    .tc-feed-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .tc-feed-item { border-bottom: 1px dashed var(--border-default); padding: 6px 0; font-size: 13px; }
    .tc-feed-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <img src="/assets/lybra_logo_white.png" alt="Lybra" class="brand-logo">
      <div style="flex: 1;">
        <h1 class="brand-title" id="page-title">项目详情</h1>
        <p class="brand-subtitle" id="page-subtitle">Owner 控制台</p>
      </div>
      <div id="lang-switcher-mount"></div>
    </div>
  </header>

  <main>
    <a href="/" class="back-link" id="back-link">
      ← 返回总览
    </a>

    <div id="project-header">
      <div class="loading">加载中...</div>
    </div>

    <!-- AIPOS-260 FIX-1: 任务中心 mounted on the REAL /workspace/<n> route.
         Static heading is baked in so curl GET /workspace/0 sees the task-center block;
         JS hydrates the #tc-* containers from /api/owner-truth?workspace=N (DOM-only). -->
    <section id="task-center-section" class="detail-section task-center-section" data-owner-truth="task-center">
      <div class="section-header">
        <h3>任务中心 · Owner 真相摘要</h3>
      </div>
      <p class="section-hint">每任务一卡：标题 + 一句话目的 + 真实阶段（从已记录的 records 推导，不改队列状态机）。点开看每轮摘要时间线；下方为按记录时间倒序的动态流。只读已记录真相。</p>
      <div id="tc-counts" class="tc-stage-pills">加载中...</div>
      <h4 class="tc-subheading">任务卡片（点开看每轮摘要）</h4>
      <div id="tc-tasks" class="tc-tasks">加载中...</div>
      <h4 class="tc-subheading">动态流（按记录时间倒序）</h4>
      <div id="tc-feed" class="tc-feed">加载中...</div>
    </section>

    <div id="project-content"></div>
  </main>

  <script src="/i18n.js"></script>
  <script>
    // Get workspace index from URL
    const pathParts = window.location.pathname.split('/');
    const workspaceIndex = pathParts[2]; // /workspace/{index}
    
    // Render page with i18n
    function renderPage() {
      // Update static text
      document.getElementById('page-title').textContent = i18n.t('detail.title');
      document.getElementById('back-link').textContent = i18n.t('detail.back_to_overview');
      
      // Mount language switcher
      const switcherMount = document.getElementById('lang-switcher-mount');
      switcherMount.innerHTML = '';
      switcherMount.appendChild(i18n.createLanguageSwitcher());
      
      // Load project data
      loadProjectDetail();
    }
    
    async function loadProjectDetail() {
      const headerHost = document.getElementById('project-header');
      const contentHost = document.getElementById('project-content');
      const countsEl = document.getElementById('tc-counts');
      const tasksEl = document.getElementById('tc-tasks');
      const feedEl = document.getElementById('tc-feed');

      const showError = (host, msg) => {
        host.replaceChildren();
        const box = document.createElement('div');
        box.className = 'empty-state';
        box.textContent = msg;
        host.appendChild(box);
      };

      try {
        // Fetch overview to resolve this workspace's label + status.
        const overviewResponse = await fetch('/api/overview');
        const overviewData = await overviewResponse.json();

        if (!overviewData.ok || !overviewData.workspaces || !overviewData.workspaces[workspaceIndex]) {
          showError(headerHost, i18n.t('detail.error_loading'));
          return;
        }

        const workspace = overviewData.workspaces[workspaceIndex];

        // Owner truth summary (record-derived stages + per-round timelines + verb feed).
        const truthResponse = await fetch(`/api/owner-truth?workspace=${workspaceIndex}`);
        const truthData = await truthResponse.json();

        const needsOwnerResponse = await fetch(`/api/needs-owner?workspace=${workspaceIndex}`);
        const needsOwnerData = await needsOwnerResponse.json();

        // 1) Workspace header.
        headerHost.replaceChildren();
        headerHost.appendChild(createProjectHeader(workspace));

        // 2) Task center (real route mount, AIPOS-260 FIX-1).
        renderTruthStagePills(countsEl, truthData);
        renderTruthTaskCards(tasksEl, truthData);
        renderTruthActivityFeed(feedEl, truthData);

        // 3) Needs-owner (actionable) + advanced/debug.
        contentHost.replaceChildren();
        contentHost.appendChild(createNeedsOwnerSection(needsOwnerData));
        contentHost.appendChild(createAdvancedSection(workspaceIndex));

      } catch (error) {
        showError(headerHost, `${i18n.t('detail.error_loading')}: ${error.message}`);
      }
    }
    
    function createProjectHeader(workspace) {
      const header = document.createElement('div');
      header.className = 'project-header';
      
      const title = document.createElement('h2');
      title.className = 'project-title';
      title.textContent = workspace.label || 'Unnamed Project';
      
      const badge = document.createElement('span');
      badge.className = 'project-status-badge';
      badge.textContent = i18n.t(`status.${workspace.status || 'unknown'}`);
      
      header.appendChild(title);
      header.appendChild(badge);
      
      return header;
    }
    
    // AIPOS-260 FIX-1: record-derived true-stage count pills (replaces the fake
    // "claimed = 进行中" count). Renders into the #tc-counts container, DOM-only.
    // FIX-2 F-261-3: pills collapse to three top-level states (已发布/执行中/已闭环);
    // falls back to the fine-grained stage_counts when the three-state keys absent.
    function renderTruthStagePills(container, truthData) {
      container.replaceChildren();
      if (!truthData || truthData.ok === false) {
        const note = document.createElement('span');
        note.className = 'ev-empty';
        note.textContent = (truthData && truthData.error) ? truthData.error : i18n.t('detail.error_loading');
        container.appendChild(note);
        return;
      }
      const d = truthData.data || {};
      const useThreeState = !!(d.top_level_counts && d.top_level_order);
      const counts = useThreeState ? (d.top_level_counts || {}) : (d.stage_counts || {});
      const labels = useThreeState ? (d.top_level_labels || {}) : (d.stage_labels || {});
      const order = useThreeState ? (d.top_level_order || []) : (d.true_stage_order || []);
      // Canonical stage order first, then any extras; only non-zero counts.
      const keys = order.filter(k => counts[k]).concat(
        Object.keys(counts).filter(k => !order.includes(k) && counts[k])
      );
      if (keys.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'ev-empty';
        empty.textContent = i18n.t('detail.timeline.empty');
        container.appendChild(empty);
        return;
      }
      keys.forEach(stage => {
        const pill = document.createElement('span');
        pill.className = `stage-pill is-${stage}`;
        const lbl = document.createElement('span');
        lbl.textContent = labels[stage] || stage;
        const num = document.createElement('span');
        num.className = 'stage-num';
        num.textContent = String(counts[stage]);
        pill.appendChild(lbl);
        pill.appendChild(num);
        container.appendChild(pill);
      });
    }
    
    function createNeedsOwnerSection(needsOwnerData) {
      const section = document.createElement('div');
      section.className = 'detail-section';
      
      const header = document.createElement('div');
      header.className = 'section-header';
      const title = document.createElement('h3');
      title.textContent = i18n.t('detail.section.needs_owner');
      header.appendChild(title);
      section.appendChild(header);
      
      const tasks = needsOwnerData?.data?.tasks || [];
      
      if (tasks.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = i18n.t('detail.needs_owner.empty');
        section.appendChild(empty);
        return section;
      }
      
      const list = document.createElement('div');
      list.className = 'needs-list';
      
      tasks.forEach(task => {
        const item = document.createElement('div');
        item.className = 'needs-item';
        
        const itemHeader = document.createElement('div');
        itemHeader.className = 'needs-item-header';
        
        const taskId = document.createElement('div');
        taskId.className = 'needs-task-id';
        taskId.textContent = `${i18n.t('detail.needs_owner.task')}: ${task.task_id || 'N/A'}`;
        itemHeader.appendChild(taskId);
        
        item.appendChild(itemHeader);
        
        // Reason (translate internal fields to human-readable)
        const reason = document.createElement('div');
        reason.className = 'needs-reason';
        const reasonText = formatNeedsOwnerReason(task);
        reason.textContent = `${i18n.t('detail.needs_owner.reason')}: ${reasonText}`;
        item.appendChild(reason);
        
        // Next command (if available)
        const command = generateNextCommand(task);
        if (command) {
          const cmdLabel = document.createElement('div');
          cmdLabel.style.fontSize = '12px';
          cmdLabel.style.fontWeight = '700';
          cmdLabel.style.color = 'var(--text-secondary)';
          cmdLabel.style.marginBottom = '0.5rem';
          cmdLabel.textContent = i18n.t('detail.needs_owner.command');
          item.appendChild(cmdLabel);
          
          const cmdDiv = document.createElement('div');
          cmdDiv.className = 'needs-command';
          
          const cmdText = document.createElement('code');
          cmdText.style.flex = '1';
          cmdText.textContent = command;
          
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-button';
          copyBtn.textContent = i18n.t('detail.needs_owner.copy');
          copyBtn.onclick = () => {
            navigator.clipboard.writeText(command);
            copyBtn.textContent = i18n.t('detail.needs_owner.copied');
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.textContent = i18n.t('detail.needs_owner.copy');
              copyBtn.classList.remove('copied');
            }, 2000);
          };
          
          cmdDiv.appendChild(cmdText);
          cmdDiv.appendChild(copyBtn);
          item.appendChild(cmdDiv);
        }
        
        list.appendChild(item);
      });
      
      section.appendChild(list);
      return section;
    }
    
    function formatNeedsOwnerReason(task) {
      // Translate internal reasons to human-readable Chinese/English
      const reasons = task.needs_owner_reasons || [];
      if (reasons.length > 0) {
        return reasons.join(', ');
      }
      
      if (task.verdict === 'NEEDS_OWNER') {
        return i18n.getCurrentLang() === 'zh' ? '需要 Owner 审批' : 'Requires Owner approval';
      }
      
      return i18n.getCurrentLang() === 'zh' ? '待审核' : 'Pending review';
    }
    
    function generateNextCommand(task) {
      // Generate appropriate command based on task state
      const taskId = task.task_id;
      if (!taskId) return null;
      
      // Simple heuristic: if needs owner, suggest review command
      return `lybra review ${taskId}`;
    }
    
    // Shared event renderer: verb + actor [+ task] + time [+ verdict] + summary.
    // DOM-only (textContent); renders record-authored text safely.
    // AIPOS-261: renders one truth event in 人话 — leads with the full sentence
    // (phrase) + Chinese role label; the raw agent instance collapses to a small
    // clickable link (opens the agent-info popup when agent_info is present).
    // `verb`/`actor`/`verdict` are preserved on the node for contract/debug visibility.
    function appendTruthEvent(target, ev, withTask) {
      const head = document.createElement('div');
      head.className = 'ev-head';
      const role = document.createElement('span');
      const roleText = ev.role || '';
      role.className = 'ev-role' + (roleText ? ' r-' + roleClassKey(roleText) : '');
      role.textContent = roleText || ev.record_type || '';
      head.appendChild(role);
      const phrase = document.createElement('span');
      phrase.className = 'ev-phrase';
      phrase.textContent = ev.phrase || ev.verb || ev.record_type || i18n.t('detail.timeline.type.unknown');
      head.appendChild(phrase);
      if (ev.actor) {
        if (ev.agent_info) {
          const link = document.createElement('button');
          link.type = 'button';
          link.className = 'agent-link';
          link.textContent = ev.actor;
          link.title = '查看 agent 信息';
          link.addEventListener('click', () => showAgentPopup(ev.agent_info));
          head.appendChild(link);
        } else {
          const actor = document.createElement('span');
          actor.className = 'ev-actor';
          actor.textContent = ev.actor;
          head.appendChild(actor);
        }
      }
      if (withTask) {
        const t = document.createElement('span');
        t.className = 'ev-actor';
        t.textContent = ev.task_id || '—';
        head.appendChild(t);
      }
      const time = document.createElement('span');
      time.className = 'ev-time';
      time.textContent = ev.timestamp ? new Date(ev.timestamp).toLocaleString() : '';
      head.appendChild(time);
      if (ev.verdict) {
        const v = document.createElement('span');
        v.className = `stage-badge sb-${String(ev.verdict).toLowerCase()}`;
        v.textContent = ev.verdict;
        head.appendChild(v);
      }
      target.appendChild(head);
      if (ev.summary) {
        const s = document.createElement('div');
        s.className = 'ev-summary';
        s.textContent = ev.summary;
        target.appendChild(s);
      }
    }

    // Map a Chinese role label to a CSS modifier (Owner / audit / exec).
    function roleClassKey(roleText) {
      if (roleText === 'Owner') return 'Owner';
      if (roleText === '审计员') return 'audit';
      return '';
    }

    // AIPOS-261: agent info popup. Model + token fields are SELF-REPORTED (labeled
    // 自报); absent fields show 未记录. Duration derives from session created/updated.
    function showAgentPopup(info) {
      const old = document.getElementById('agent-popup-mask');
      if (old) old.remove();
      const mask = document.createElement('div');
      mask.id = 'agent-popup-mask';
      mask.className = 'agent-popup-mask';
      mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
      const box = document.createElement('div');
      box.className = 'agent-popup';
      const h = document.createElement('h4');
      h.textContent = `${info.role || 'agent'} 信息`;
      box.appendChild(h);
      const sub = document.createElement('div');
      sub.className = 'ap-sub';
      sub.textContent = info.instance || '—';
      box.appendChild(sub);
      const rows = [
        ['角色', info.role, false],
        ['实例', info.instance, false],
        ['harness', info.harness, false],
      ];
      // Self-reported block (model + tokens) — always present, flagged 自报.
      const selfTag = document.createElement('span');
      selfTag.className = 'ap-tag';
      selfTag.textContent = '自报';
      rows.push(['自报模型', nv(info.model_self_reported), true]);
      rows.push(['自报 tokens(in/out)', tokenPair(info), true]);
      rows.push(['本次耗时', durationLabel(info.duration_seconds), false]);
      rows.forEach(([k, v, isSelf]) => {
        const row = document.createElement('div');
        row.className = 'ap-row';
        const kEl = document.createElement('span');
        kEl.className = 'ap-k';
        kEl.textContent = k;
        if (isSelf) kEl.appendChild(selfTag.cloneNode(true));
        const vEl = document.createElement('span');
        vEl.className = 'ap-v' + (v === '未记录' ? ' muted' : '');
        vEl.textContent = v;
        row.appendChild(kEl);
        row.appendChild(vEl);
        box.appendChild(row);
      });
      const close = document.createElement('button');
      close.className = 'ap-close';
      close.textContent = '关闭';
      close.addEventListener('click', () => mask.remove());
      box.appendChild(close);
      mask.appendChild(box);
      document.body.appendChild(mask);
    }
    function nv(v) { return (v === null || v === undefined || v === '') ? '未记录' : String(v); }
    function tokenPair(info) {
      if (info.tokens_in === null && info.tokens_out === null) return '未记录';
      return `${nv(info.tokens_in)} / ${nv(info.tokens_out)}`;
    }
    function durationLabel(sec) {
      if (sec === null || sec === undefined) return '未记录';
      if (sec < 60) return sec + ' 秒';
      if (sec < 3600) return Math.round(sec / 60) + ' 分钟';
      return (sec / 3600).toFixed(1) + ' 小时';
    }

    // AIPOS-261: closure-unit card. Face = one-line stage chain (人话); body =
    // purpose + family members + merged timeline (click to expand 全家时间线).
    function renderTruthTaskCards(container, truthData) {
      container.replaceChildren();
      if (!truthData || truthData.ok === false) {
        const note = document.createElement('p');
        note.className = 'ev-empty';
        note.textContent = (truthData && truthData.error) ? truthData.error : i18n.t('detail.error_loading');
        container.appendChild(note);
        return;
      }
      // AIPOS-261: task list is grouped by closure unit (主卡 + R/F*/FZ 全家).
      // Falls back to one-unit-per-task when closure_units is absent.
      const data = truthData.data || {};
      let units = Array.isArray(data.closure_units) ? data.closure_units : [];
      if (units.length === 0) {
        units = (data.tasks || []).map(t => ({
          root_task_id: t.task_id, title: t.title, purpose: t.purpose,
          true_stage: t.true_stage, stage_label: t.stage_label,
          top_level_state: t.top_level_state, badge_label: t.badge_label,
          stage_chain: t.stage_label || t.true_stage || '',
          members: [{ task_id: t.task_id, member_kind: 'main', has_return: false }],
          timeline: t.timeline || [],
        }));
      }
      if (units.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'ev-empty';
        empty.textContent = i18n.t('detail.timeline.empty');
        container.appendChild(empty);
        return;
      }
      units.forEach(u => {
        const card = document.createElement('details');
        // FIX-2 F-261-3: 执行中 cards get a dedicated background tint (top-level bucket).
        card.className = 'tc-task-card' + (u.top_level_state ? ' tlc-' + u.top_level_state : '');
        const head = document.createElement('summary');
        head.className = 'tc-task-head';
        const badge = document.createElement('span');
        badge.className = `stage-badge sb-${u.true_stage || 'unknown'}`;
        // FIX-2 F-261-3: composed badge (执行中 · 判决 PASS); sub-state color retained.
        badge.textContent = u.badge_label || u.stage_label || u.true_stage || '';
        head.appendChild(badge);
        const title = document.createElement('span');
        title.className = 'tc-task-title';
        title.textContent = u.title || u.root_task_id || '(untitled)';
        head.appendChild(title);
        const id = document.createElement('span');
        id.className = 'tc-task-id';
        id.textContent = u.root_task_id || '';
        head.appendChild(id);
        card.appendChild(head);
        const body = document.createElement('div');
        body.className = 'tc-task-body';
        // Face: one-line stage chain (人话).
        const face = document.createElement('p');
        face.className = 'tc-unit-face';
        face.innerHTML = chainFaceHtml(u.stage_chain);
        body.appendChild(face);
        // Purpose (one-liner).
        const purpose = document.createElement('p');
        purpose.className = 'tc-purpose';
        const lbl = document.createElement('span');
        lbl.className = 'muted';
        lbl.textContent = i18n.t('detail.needs_owner.what_to_do') + ':';
        purpose.appendChild(lbl);
        purpose.appendChild(document.createTextNode(' ' + (u.purpose || '(无目的摘要)')));
        body.appendChild(purpose);
        // Family members (chips: main / audit / fix / finalize).
        const members = u.members || [];
        if (members.length > 0) {
          const mlist = document.createElement('ul');
          mlist.className = 'tc-members';
          members.forEach(m => {
            const chip = document.createElement('li');
            chip.className = 'member-chip mk-' + (m.member_kind || 'main');
            const mk = document.createElement('span');
            mk.className = 'mk';
            mk.textContent = memberKindLabel(m.member_kind);
            chip.appendChild(mk);
            chip.appendChild(document.createTextNode(m.task_id || ''));
            mlist.appendChild(chip);
          });
          body.appendChild(mlist);
        }
        // Merged family timeline (点开看全家时间线).
        const tl = document.createElement('ol');
        tl.className = 'tc-timeline';
        const timeline = u.timeline || [];
        if (timeline.length === 0) {
          const e = document.createElement('li');
          e.className = 'ev-empty';
          e.textContent = i18n.t('detail.timeline.empty');
          tl.appendChild(e);
        } else {
          timeline.forEach(ev => {
            const li = document.createElement('li');
            li.className = 'tc-event';
            appendTruthEvent(li, ev, false);
            tl.appendChild(li);
          });
        }
        body.appendChild(tl);
        card.appendChild(body);
        container.appendChild(card);
      });
    }

    // Color PASS/FAIL tokens in the face string; everything else plain.
    function chainFaceHtml(text) {
      if (!text) return '';
      const esc = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return esc.replace(/PASS/g, '<span class="chain-pass">PASS</span>')
                .replace(/FAIL/g, '<span class="chain-fail">FAIL</span>');
    }
    function memberKindLabel(kind) {
      return ({ main: '主', audit: '审', fix: '修', finalize: '编' })[kind] || kind || '';
    }
    
    // AIPOS-260 FIX-1: cross-task activity feed (动态流) — newest-first, with a
    // real verb + summary per record_type (replaces the verb-less "X 操作了任务 Y").
    function renderTruthActivityFeed(container, truthData) {
      container.replaceChildren();
      if (!truthData || truthData.ok === false) {
        const note = document.createElement('p');
        note.className = 'ev-empty';
        note.textContent = (truthData && truthData.error) ? truthData.error : i18n.t('detail.error_loading');
        container.appendChild(note);
        return;
      }
      const feed = (truthData.data && truthData.data.activity_feed) || [];
      if (feed.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'ev-empty';
        empty.textContent = i18n.t('detail.timeline.empty');
        container.appendChild(empty);
        return;
      }
      const list = document.createElement('ul');
      list.className = 'tc-feed-list';
      feed.forEach(ev => {
        const li = document.createElement('li');
        li.className = 'tc-feed-item';
        appendTruthEvent(li, ev, true);
        list.appendChild(li);
      });
      container.appendChild(list);
    }
    
    function createAdvancedSection(workspaceIndex) {
      const section = document.createElement('div');
      section.className = 'advanced-section';
      
      const header = document.createElement('div');
      header.className = 'advanced-header';
      header.textContent = i18n.t('detail.advanced');
      section.appendChild(header);
      
      const link = document.createElement('a');
      link.className = 'debug-link';
      link.href = `/index.html?workspace=${workspaceIndex}`;
      link.textContent = i18n.t('detail.advanced.debug_view');
      
      const desc = document.createElement('div');
      desc.className = 'debug-description';
      desc.textContent = i18n.t('detail.advanced.debug_desc');
      
      section.appendChild(link);
      section.appendChild(desc);
      
      return section;
    }
    
    // Load on page ready
    renderPage();
  </script>
</body>
