<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="login.title">Lybra Board</title>
  <link rel="stylesheet" href="/readonly-pages.css">
  <!-- AIPOS-F277: login page joins the board i18n channel (static/i18n.js; default language = data-board-default-lang injected by the server) -->
  <script src="/i18n.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <img src="/assets/lybra-logo-black.png" alt="Lybra" class="login-logo">
    <h1 class="login-title">Lybra Board</h1>
    <p class="login-sub" id="login-sub" data-i18n="login.sub"></p>

    <form id="login-form" autocomplete="off" novalidate>
      <label class="login-field">
        <span class="login-label">Token</span>
        <input type="password" name="token" id="token"
               autocomplete="current-password"
               data-i18n-attr="placeholder:login.token_placeholder" required>
      </label>
      <button type="submit" class="login-submit" id="login-submit" data-i18n="login.submit"></button>
      <p id="login-error" class="login-error" role="alert" hidden></p>
    </form>

    <!-- AIPOS-271: local OTC sign-in is completed in the browser by `lybra board open`; the token form and the cross-machine device code stay as manual entries; an expired OTC link shows a notice. -->
    <div class="login-divider"><span data-i18n="login.or"></span></div>

    <button type="button" class="login-submit login-submit--alt" id="device-toggle" data-i18n="login.device_toggle"></button>

    <section id="device-panel" class="device-panel" hidden>
      <!-- F-271-2: three sign-in paths side by side -->
      <p class="device-hint-title" data-i18n="login.device_title"></p>
      <div class="device-code" id="device-code">······</div>
      <div class="device-paths">
        <p class="device-path"><strong data-i18n="login.path1_title"></strong><span data-i18n="login.path1_text"></span></p>
        <p class="device-path"><strong data-i18n="login.path2_title"></strong><span data-i18n="login.path2_text"></span><code data-i18n="login.path2_code"></code></p>
        <p class="device-path"><strong data-i18n="login.path3_title"></strong><span data-i18n="login.path3_text"></span></p>
      </div>
      <p class="device-status" id="device-status" data-i18n="login.generating"></p>
      <p class="device-countdown" id="device-countdown" hidden></p>
      <!-- F-271-3: remember this device for 30 days -->
      <label class="device-remember">
        <input type="checkbox" id="device-remember" checked>
        <span data-i18n="login.remember"></span>
      </label>
      <button type="button" class="device-cancel" id="device-cancel" data-i18n="login.cancel"></button>
    </section>

    <p class="login-hint" data-i18n="login.hint"></p>
  </main>

  <script>
    (function () {
      "use strict";
      var T = window.i18n.t;
      var form = document.getElementById("login-form");
      var err = document.getElementById("login-error");
      var btn = document.getElementById("login-submit");
      // AIPOS-F277: same channel as the other board pages; html lang follows the chosen language, with a zh / EN switcher
      document.documentElement.lang = window.i18n.getCurrentLang() === "en" ? "en" : "zh-CN";
      window.i18n.applyTranslations();
      document.querySelector(".login-card").appendChild(window.i18n.createLanguageSwitcher());

      function showError(msg) {
        err.hidden = false;
        err.textContent = msg || T("login.failed");
      }

      // AIPOS-271:OTC 链接失效/过期/已用 → server 302 到 /login?otc_err=1,此处提示。
      if (location.search.indexOf("otc_err=1") !== -1) {
        showError(T("login.otc_err"));
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.hidden = true;
        var token = document.getElementById("token").value;
        if (!token) { showError(T("login.need_token")); return; }
        btn.disabled = true;
        btn.textContent = T("login.checking");
        fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ token: token })
        }).then(function (resp) {
          return resp.json().then(function (j) { return { status: resp.status, json: j }; });
        }).then(function (res) {
          if (res.status === 200 && res.json && res.json.ok) {
            window.location.href = res.json.redirect || "/";
          } else {
            btn.disabled = false;
            btn.textContent = T("login.submit");
            showError((res.json && res.json.message) || T("login.invalid"));
          }
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = T("login.submit");
          showError(T("login.network"));
        });
      });

      // ---- AIPOS-271 跨机设备码流 ----
      var toggle = document.getElementById("device-toggle");
      var panel = document.getElementById("device-panel");
      var codeEl = document.getElementById("device-code");
      var statusEl = document.getElementById("device-status");
      var countdownEl = document.getElementById("device-countdown");
      var cancelBtn = document.getElementById("device-cancel");
      var rememberCheckbox = document.getElementById("device-remember");
      var pollTimer = null, countTimer = null, expiresAt = 0;

      function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        if (countTimer) { clearInterval(countTimer); countTimer = null; }
      }

      function resetPanel() {
        stopPolling();
        panel.hidden = true;
        toggle.disabled = false;
        codeEl.textContent = "······";
        statusEl.textContent = T("login.generating");
        countdownEl.hidden = true;
      }

      cancelBtn.addEventListener("click", resetPanel);

      toggle.addEventListener("click", function () {
        toggle.disabled = true;
        panel.hidden = false;
        statusEl.textContent = T("login.generating");
        fetch("/api/auth/device/code", {
          method: "POST", headers: { "Content-Type": "application/json" },
          credentials: "same-origin", body: "{}"
        }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j || !j.ok) { showError(T("login.device_failed")); resetPanel(); return; }
          codeEl.textContent = j.code;
          expiresAt = Date.now() + (j.expires_in || 300) * 1000;
          countdownEl.hidden = false;
          statusEl.textContent = T("login.waiting");
          countTimer = setInterval(function () {
            var left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
            countdownEl.textContent = T("login.remaining").replace("{s}", String(left));
            if (left <= 0) { stopPolling(); statusEl.textContent = T("login.expired"); }
          }, 1000);
          pollTimer = setInterval(pollDevice, 1500);
          function pollDevice() {
            // F-271-3: 带上 remember 标志
            var remember = rememberCheckbox.checked;
            fetch("/api/auth/device/poll", {
              method: "POST", headers: { "Content-Type": "application/json" },
              credentials: "same-origin", body: JSON.stringify({ code: j.code, remember: remember })
            }).then(function (r) { return r.json(); }).then(function (p) {
              if (p && p.status === "approved") {
                stopPolling();
                statusEl.textContent = T("login.approved");
                window.location.href = p.redirect || "/";
              } else if (p && p.status === "expired") {
                stopPolling();
                statusEl.textContent = T("login.expired");
              } else if (p && p.status === "unknown") {
                stopPolling();
                statusEl.textContent = T("login.code_invalid");
              }
            }).catch(function () { /* 网络抖动:下一轮再试 */ });
          }
        }).catch(function () { showError(T("login.device_network")); resetPanel(); });
      });
    })();
  </script>
</body>
</html>
